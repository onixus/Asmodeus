[package]
name = "asmodeus-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "asmodeus-runner"
path = "src/main.rs"

[features]
# Real eBPF/TC network-chaos backend via `aya` — Linux stand only. Off by
# default so the workspace builds and tests on every platform (macOS included);
# without it the runner uses the in-process SimBackend. See src/aya_backend.rs.
ebpf = ["dep:aya"]

[dependencies]
asmodeus-common = { workspace = true }
asmodeus-crypto = { workspace = true }
asmodeus-dsl = { workspace = true }
asmodeus-safety = { workspace = true }
asmodeus-proto = { workspace = true }
# Shared map ABI for the eBPF/TC datapath. A tiny no_std lib that builds on the
# stable host toolchain, so it is an ordinary dependency; `aya` below is the
# part gated behind `ebpf`.
asmodeus-netchaos-ebpf = { workspace = true }
# Linked only under `--features ebpf` (Linux stand). The default build carries
# neither aya nor the kernel attach; the aya-backend module is cfg'd out.
aya = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ring = { workspace = true }
libc = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
asmodeus-testkit = { workspace = true }
